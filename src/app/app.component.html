<main class="principal">
  <div class="conteudo">
    <h1>{{ 'BEMVINDO' | translate }}</h1>
    <h2>{{"TITULO" | translate}}</h2>
  </div>
  <div class="acoes">
    <button (click)="mudarIdioma('pt')">{{"BOTOES.PORTUGUES" | translate }}</button>
    <button (click)="mudarIdioma('fr')">{{"BOTOES.FRANCES" | translate }}</button>
    <button (click)="mudarIdioma('en')">{{"BOTOES.INGLES" | translate }}</button>
  </div>
  <div class="autenticacao">
    <h1>{{"LOGIN.CABECALHO" | translate}}</h1>
    <button (click)="conectar()">🔑 {{"LOGIN.CONECTAR" | translate }}</button>
    <button (click)="desconectar()">🚪 {{"LOGIN.DESCONECTAR" | translate}}</button>
    <p>{{"LOGIN.ESTADO" | translate }} {{ estaAutenticado ? '✅ Logado' : '❌ Deslogado' }}</p>
  </div>
</main>

<router-outlet />
